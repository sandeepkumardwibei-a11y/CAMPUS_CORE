spring.application.name=campuscore-backend
server.port=8300
server.servlet.context-path=/api

# ??? MySQL DataSource ???????????????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/campuscore_database_FINAL?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ??? SQL Initialization ??????????????????????????????????????????????
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ??? HikariCP Connection Pool Tuning ?????????????????????????????????
spring.datasource.hikari.pool-name=CampusCoreHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# ??? JPA / Hibernate ?????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ??? JWT Configuration ???????????????????????????????????????????????
app.jwt.secret=Y2FtcHVzQ29yZVMzY3IzdEtleUZvckpXVFNpZ25pbmcyMDI0X0NoYW5nZVRoaXNJblByb2R1Y3Rpb25XaXRoQVN0cm9uZzUxMkJpdEtleQ==
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ??? CORS ????????????????????????????????????????????????????????????
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ??? Multipart File Upload ???????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ??? Actuator ????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ??? Logging ?????????????????????????????????????????????????????????
logging.level.root=INFO
logging.level.com.campuscore=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ??? Springdoc / Swagger UI ??????????????????????????????????????????
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Disable strict Spring Cloud version compatibility verification
spring.cloud.compatibility-verifier.enabled=false
# --- SQL logs diagnostics ---
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
